name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registry:
    name: Registry (pytest + OpenAPI drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -q
      - name: Check canonical manifest schema drift
        run: |
          cmp -s app/security_review/agent.schema.json ../specs/agent.schema.json \
            && cmp -s app/security_review/agent.schema.json ../sdk/src/schema/agent.schema.json \
            || { echo "canonical manifest schema copies diverged from specs/agent.schema.json"; exit 1; }
      - name: Check OpenAPI contract drift
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- openapi/registry-openapi.json

  typescript:
    name: TypeScript workspaces (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  package:
    name: Single-package distribution (web build + pack + install smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build web (Next.js standalone)
        run: npm run build -w @openagenthub/web
      - name: Pack npm artifact
        run: node scripts/package.mjs
      - name: Verify packed artifact installs and runs standalone
        run: node scripts/verify-pack.mjs
